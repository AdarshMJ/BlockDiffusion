# ABLATION: same as config_coarse_planar.yaml but with de=2 (binary) coarse edges.
#
# Question it answers: are the de=11 weight classes stealing capacity from the
# diffusion and causing the "holes" in the generated coarse graphs?
#
# Everything (coarsening params, model, training) is IDENTICAL to
# config_coarse_planar.yaml except `dataset.binary_edges: true`. Run both and
# compare `clustering MMD` + graphs/comparisons/*.png.
#
#   python main.py --config configs/config_coarse_planar_de2.yaml --mode train --device cuda
#
# NOTE: force_rebuild is FALSE here on purpose. It reads the exact same coarse
# cache (r0.8_normalized_edges_K100) that the de=11 run built — no re-coarsening,
# and safe to run while the other job is reading it.

general:
  name: 'coarse_planar_de2'
  seed: 42
  check_val_every_n_epochs: 100
  sample_every_val: 100
  number_chain_steps: 1
  samples_to_generate: 32
  chains_to_save: 0
  final_model_samples_to_generate: 100
  final_model_samples_to_save: 10

dataset:
  name: 'coarse_planar'
  num_train_graphs: 5
  pin_memory: false
  binary_edges: true            # <-- THE ONLY DIFFERENCE: collapse de=11 -> de=2

# ---- Stage A: coarsening params — must match the de=11 run to reuse its cache.
coarsening:
  planar_dir: 'data/planar500'
  cache_dir: 'data/coarse_planar'
  r: 0.8
  K: 100
  laplacian_kind: 'normalized'
  method: 'edges'
  force_rebuild: false          # read the existing cache; never rebuild here

# ---- Stage B: DiGress on G_c (identical to the de=11 run)
model:
  n_layers: 10
  hidden_dims:
    dx: 256
    de: 64
    dy: 64
    n_head: 8
    dim_ffX: 256
    dim_ffE: 64
    dim_ffY: 256
  hidden_mlp_dims:
    X: 256
    E: 128
    y: 128

  diffusion_steps: 500
  diffusion_noise_schedule: 'cosine'
  transition: 'marginal'        # now uses the de=2 edge marginal

  extra_features: 'all'         # AUX FEATURES ON

  lambda_train:
    - 1.0   # X
    - 5.0   # E
    - 1.0   # y

train:
  n_epochs: 5000
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.00012
  num_workers: 0
  log_every_steps: 100
  save_every_epochs: 100
